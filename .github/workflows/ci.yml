name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      # Ubuntu's apt ffmpeg predates the xpsnr filter, so the end-to-end
      # encode test skips itself here; it runs wherever a 7.1+ ffmpeg is on PATH.
      - run: uv run pytest -q -rs
